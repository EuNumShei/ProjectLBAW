openapi: 3.0.0
info:
  title: 'GlintHub OpenAPI'
  version: 1.0.0
  description: 'Web Resources Specification for GlintHub'

servers:
- url: db.feup.up.pt
  description: Production server

tags:
  - name: 'M01: Authentication and Individual Profile'
  - name: 'M02: Social Interactions'
  - name: 'M03: Content Management'
  - name: 'M04: Notifications'
  - name: 'M05: Search and Discovery'
  - name: 'M06: Privacy and Security'
  - name: 'M07: Admin and Moderation Tools'
  - name: 'M08: Groups'
  
paths:
  /:
    get:
      operationId: R101
      summary: 'R101 : Home Redirection'
      description: 'Redirects the guest to the home page. Access: PUB'
      tags:
        - 'M01: Authentication and Individual Profile'
      responses:
        '302':
          description: 'Redirect to /home'
          headers:
            /home:
              schema:
                type: string


  /login:
    get:
      operationId: R102
      summary: 'R102 : Login Form'
      description: 'Provide login form. Access: PUB'
      tags:
        - 'M01: Authentication and Individual Profile'
      responses:
        '200':
          description: 'Ok. Show log-in UI'
        '302':
          description: 'Redirect after verifying user credentials'
          headers:
            /home:
              description: 'You are already logged in!'
              schema:
                type: string

    post:
      operationId: R103
      summary: 'R103 : Login Action'
      description: 'Processes the login form submission. Access: PUB'
      tags:
        - 'M01: Authentication and Individual Profile'
      requestBody:
        required: true
        content:
          application/x-www-form-urllencoded:
            schema:
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
              required:
                  - email
                  - password
      responses:
        '302':
          description: 'Redirect after processing the login credentials.'
          headers:
            /home:
              description: 'You have logged in successfully!'
              schema:
                type: string
            /login:
              description: 'The provided credentials do not match our records.'
              schema:
                type: string

  /logout:
    get:
      operationId: R104
      summary: 'R104: View Logout'
      description: 'Provide logout redirection. Access: PUB'
      tags:
        - 'M01: Authentication and Individual Profile'
      responses:
        '302':
          description: 'Redirect after verifying logout'
          headers:
            /login:
              description: 'You have logged out successfully!'
              schema:
                type: string
    post:
      operationId: R105
      summary: 'R105 : Logout Action'
      description: 'Logout the current authenticated used. Access: USR, ADM'
      tags:
        - 'M01: Authentication and Individual Profile'
      responses:
        '302':
          description: 'Redirect after processing logout.'
          headers:
            /login:
              description: 'You have logged out successfully!'
              schema:
                type: string

  /register:
    get:
      operationId: R106
      summary: 'R106 : Register Form'
      description: 'Provide new user registration form. Access: PUB'
      tags:
        - 'M01: Authentication and Individual Profile'
      responses:
        '200':
          description: 'Ok. Show sign-up UI.'

    post:
      operationId: R107
      summary: 'R107 : Register Action'
      description: 'Processes the new user registration form submission. Access: PUB'
      tags:
        - 'M01: Authentication and Individual Profile'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
              required:
                - name
                - email
                - password
      responses:
        '302':
          description: 'Redirect after processing the new user information.'
          headers:
            /home:
              description: 'You have successfully registered & logged in!'
              schema:
                type: string
  
  /profile/{id}:
    get:
      operationId: R108
      summary: 'R108 : Profile Page'
      tags:
        - 'M01: Authentication and Individual Profile'
      description: 'Show the individual user profile. Access: PUB'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Ok. Show view profile UI'
    
    put:
      operationId: R109
      summary: 'R109 : Edit Profile'
      tags:
        - 'M01: Authentication and Individual Profile'
      description: 'Edit the individual user profile. Access: OWN, ADM'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                  maxLength: 100
                profile_pic:
                  type: object
                  format: jpeg,png,jpg,gif,svg
                  nullable: true
                  maxLength: 5048
                bio:
                  type: string
                  nullable: true
                admin:
                  type: boolean
                  nullable: true
              required:
                - full_name
      responses:
        '302':
          description: 'Redirect after updating the new user profile.'
          headers:
            /profile/{id}:
              description: 'Profile updated successfully.'
              schema:
                type: string
      
    delete:
      operationId: R110
      summary: 'R110 : Delete Profile'
      description: 'Remove the specified profile. Access: OWN, ADM'
      tags:
        - 'M01: Authentication and Individual Profile'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: 'Profile deleted'

      
  
  /profile/{id}/edit:
      get:
        operationId: R111
        summary: 'R111 : Profile Edit Page'
        description: 'View the profile edit page. Access: OWN, ADM'
        tags:
          - 'M01: Authentication and Individual Profile'
        parameters:
          - name: id
            in: path
            required: true
            schema:
              type: integer
        responses:
          '200':
            description:  'Ok. Show edit profile UI'
          '302':
            description: 'Redirect after trying to edit unauthorized profiles.'
            headers:
              /home:
                description: 'You are not authorized to edit this post.'
                schema: 
                  type: string

  /post:
    post:
      operationId: R301
      summary: 'R301 : Create Post'
      description: 'Create a new post . Access: USR, ADM'
      tags:
        - 'M03: Content Management'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                content:
                  type: string
                  maxLength: 255
                image_url:
                  type: object
                  format: jpeg,png,jpg,gif,svg
                  nullable: true
                  maxLength: 5048
                group_id:
                  nullable: true
                  description: "The ID of the group. Must exist in the 'group' table."
              required:
                - content
      responses:
        '302':
          description: 'Redirect for various successful and unsuccessful ocaasions'
          headers:
            302Success:
              description: 'Post created successfully! Redirected to previous page'
              schema:
                type: string
            /login:
              description: 'You must be logged in to create a post.'
              schema:
                type: string
            /home:
              description: 'You are not authorized to create a post.'
              schema:
                type: string

  /post/{id}:
    get:
      operationId: R302
      summary: 'R302 : View Post'
      description: 'View a post . Access: PUB'
      tags:
        - 'M03: Content Management'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Ok. Show post UI.'
    put:
      operationId: R303
      summary: 'R303 : Update Post'
      description: 'Update a post . Access: OWN, ADM'
      tags:
        - 'M03: Content Management'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                content:
                  type: string
                  maxLength: 255
                image:
                  type: object
                  format: jpeg,png,jpg,gif,svg
                  nullable: true
                  maxLength: 2048
              required:
                - content
      responses:
        '302':
          description: 'Redirect for various successful and unsuccessful updates'
          headers:
            /post/{id}:
              description: 'Post updated successfully!'
              schema:
                type: string
            /home:
              description: 'You are not authorized to edit this post.'
              schema:
                type: string
    delete:
      operationId: R304
      summary: 'R304 : Delete Post'
      description: 'Remove the specified post. Access: OWN, ADM'
      tags:
        - 'M03: Content Management'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '302':
          description: 'Redirect for various successful and unsuccessful deletions'
          headers:
            302Success:
              description: 'Post deleted successfully!'
              schema:
                type: string
              example: '/home'
            302Failure:
              description: 'You are not authorized to delete this post.'
              schema:
                type: string
              example: '/home'

  /post/{id}/edit:
    get:
      operationId: R305
      summary: 'R305 : View Edit Post Page'
      description: 'View edit a post page. Access: OWN, ADM'
      tags:
        - 'M03: Content Management'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Ok. Show edit post UI.'
        '302':
          description: 'Redirect for unauthorized post edition'
          headers:
            /home:
              description: 'You are not authorized to edit this post.'
              schema:
                type: string

  /notifications:
    get:
      operationId: R401
      summary: 'R401 : View Notifications'
      description: 'View user notifications. Access: USR, ADM'
      tags:
        - 'M04: Notifications'
      responses:
        '200':
          description: 'Ok. Show notifications UI.'
    delete:
      operationId: R402
      summary: 'R402: Remove Notifications'
      description: 'Remove notifications. Access: USR, ADM'
      tags:
        - 'M04: Notifications'
      responses:
        '204':
          description: 'Notification deleted successfully.'
        '403':
          description: 'You are not authorized to this action.'
    

  /groups:
    get:
      operationId: R801
      summary: 'R801 : View List of Groups'
      description: 'View list of groups. Access: USR, ADM'
      tags:
        - 'M08: Groups'
      responses:
        '200':
          description: 'Ok. Show group list UI.'
    post:
      operationId: R802
      summary: 'R802 : Create Group'
      description: 'Create a group. Access: USR, ADM'
      tags:
        - 'M08: Groups'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                description:
                  type: string
                  nullable: true
                author_id:
                  type: integer
              required:
                - name
                - author_id
      responses:
        '302':
          description: 'Redirect for successful group creation'
          headers:
            /groups/{id}:
                description: 'Group created successfully!'
                schema:
                  type: string
                
  /groups/create:
    get:
      operationId: R803
      summary: 'R803 : View Create Group Page'
      description: 'View create a group page. Access: USR, ADM'
      tags:
        - 'M08: Groups'
      responses:
        '200':
          description: 'Ok. Show create group UI.'

  /groups/{id}:
    get:
      operationId: R804
      summary: 'R804 : View Group'
      description: 'View a group. Access: USR, ADM'
      tags:
        - 'M08: Groups'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Ok. Show group UI.'
    put:
      operationId: R805
      summary: 'R805 : Edit Group'
      description: 'Edit information of a group. Access: OWN, ADM'
      tags:
        - 'M08: Groups'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 100
                description:
                  type: string
                  nullable: true
                author_id:
                  type: integer
              required:
                - name
                - author_id
      responses:
        '302':
          description: 'Redirect for successful group edition'
          headers:
            /groups/{id}:
                description: 'Group edited successfully!'
                schema:
                  type: string
    delete:
      operationId: R806
      summary: 'R806 : Delete Group'
      description: 'Remove the specified group. Access: OWN, ADM'
      tags:
        - 'M08: Groups'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: 'Group deleted'
          
  /groups/{id}/edit:
    get:
      operationId: R807
      summary: 'R807 : View Edit Group Page'
      description: 'View edit group page. Access: OWN, ADM'
      tags:
        - 'M08: Groups'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Ok. Show group edit UI.'
      
  /groupinvitenotification:
    post:
      operationId: R201, R403, R808
      summary: 'R201, R403, R808 : Create Group Invite Notification'
      description: 'Create a group invite notification. Access: OWN, GRP_USR, ADM'
      tags:
        - 'M04: Notifications'
        - 'M08: Groups'
        - 'M02: Social Interactions'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                receiver_id:
                  type: integer
                  description: "The ID of the receiving user. Must exist in the 'profile' table."
                sender_id:
                  type: integer
                  description: "The ID of the sending user. Must exist in the 'profile' table."
                created_at:
                  type: object
                  format: date-time
                group_id:
                  type: integer
                  description: "The ID of the group. Must exist in the 'group' table."
                request_status:
                  type: string
                notification_type:
                  type: string
                  description: 'group_invite'
              required:
                - receiver_id
                - sender_id
                - created_at
                - group_id
                - request_status
                - notification_type
      responses:
        '201':
          description: 'Group invite notification created'
        '403':
          description: 'You are not authorized to this action.'       

  /groupinvitenotifications/{notificationId}:
    put:
      operationId: R202, R404, R809
      summary: 'R202, R404, R809 : Update Group Invite Notification'
      description: 'Update a group invite notification. Access: OWN, GRP_USR, ADM'
      tags:
        - 'M04: Notifications'
        - 'M08: Groups'
        - 'M02: Social Interactions'
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                request_status:
                  type: string
              required:
                - request_status
      responses:
        '200':
          description: 'Group invite notification updated'
        '403':
          description: 'You are not authorized to this action.'
        '500':
          description: 'Error updating notification'
    
  /home:
    get:
      operationId: R501
      summary: 'R501 : View Home Page'
      description: 'View Home Page. Access: PUB'
      tags:
        - 'M05: Search and Discovery'
      responses:
        '200':
          description: 'Ok. Show home UI.'
  
  /for-you:
    get:
      operationId: R502
      summary: 'R502 : View For You Page'
      description: 'View For You Page. Access: USR, ADM'
      tags:
        - 'M05: Search and Discovery'
      responses:
        '200':
          description: 'Ok. Show for-you page UI'
        '302':
          description: 'Redirect for unauthorized access'
          headers:
            /login:
              description: 'You are not authorized to view this page.'
              schema:
                type: string

  /public-posts:
    get:
      operationId: R503
      summary: 'R503 : View Public Posts'
      description: 'View Public Posts. Access: PUB'
      tags:
        - 'M05: Search and Discovery'
      responses:
        '200':
          description: 'Ok. Show public posts UI'

  /search:
    get:
      operationId: R504
      summary: 'R504 : View Search'
      description: 'View Public Posts. Access: USR, ADM'
      tags:
        - 'M05: Search and Discovery'
      parameters:
        - in: query
          name: query
          schema:
            type: string
          required: true
          description: The search query string
        - in: query
          name: group
          schema:
            type: string
            enum: [users, groups, posts, comments]
          required: false
          description: The group to search within (default is 'users')
      responses:
        '200':
          description: 'Ok. Returns the search results in JSON format.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Unique identifier for the result
                        type:
                          type: string
                          description: Type of the result (e.g., user, group, post, comment)
                        title:
                          type: string
                          description: The title or name of the result
                        url:
                          type: string
                          description: URL to the resource
                  total:
                    type: integer
                    description: Total number of results
                example:
                  results:
                    - id: "12345"
                      type: "user"
                      title: "John Doe"
                      url: "/users/12345"
                    - id: "67890"
                      type: "post"
                      title: "How to use the API"
                      url: "/posts/67890"
                  total: 2


  /friendrequestnotifications:
    get:
      operationId: R203, R405
      summary: 'R203, R405 : View Friend Request Notifications'
      description: 'View Friend Request Notifications. Access: USR, ADM'
      tags:
        - 'M04: Notifications'
        - 'M02: Social Interactions'
      responses:
        '200':
          description: 'Ok. Show friend request notifications UI.'
    post:
      operationId: R204, R406
      summary: 'R204, R406 : Create Friend Request Notifications'
      description: 'Create Friend Request Notifications. Access: USR, ADM'
      tags:
        - 'M04: Notifications'
        - 'M02: Social Interactions'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                receiver_id:
                  type: integer
                  description: "The ID of the receiving user. Must exist in the 'profile' table."
                sender_id:
                  type: integer
                  description: "The ID of the sending user. Must exist in the 'profile' table."
                created_at:
                  type: object
                  format: date-time
                request_status:
                  type: string
                notification_type:
                  type: string
                  description: 'friend_request'
              required:
                - receiver_id
                - sender_id
                - created_at
                - request_status
                - notification_type
      responses:
        '201':
          description: 'Friend request notification created'
    put:
      operationId: R205, R407
      summary: 'R205, R407 : Edit Friend Request Notifications'
      description: 'Edit a friend request notification (accept only for now). Access: USR, ADM'
      tags:
        - 'M04: Notifications'
        - 'M02: Social Interactions'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                request_status:
                  type: string
              required:
                - request_status
      responses:
        '200':
          description: 'Friend request notification updated'
        '500':
          description: 'Friend request notification edited unsuccessfully!'
        '403':
          description: 'You are not authorized to this action.'

  /settings:
    get:
      operationId: R601
      summary: 'R601 : View Settings'
      description: 'View settings page. Access: USR, ADM'
      tags:
        - 'M06: Privacy and Security'
      responses:
        '200':
          description: 'Ok. Show settings UI.'
          
  /settings/account:
    get:
      operationId: R602
      summary: 'R602 : View Account Settings'
      description: 'View the account settings page. Access: USR, ADM'
      tags:
        - 'M06: Privacy and Security'
      responses:
        '200':
          description: 'Ok. Show account settings UI.'
  
  /settings/change_password:
    get:
      operationId: R603
      summary: 'R603 : View Change Password Settings'
      description: 'View the change password settings page. Access: USR, ADM'
      tags:
        - 'M06: Privacy and Security'
      responses:
        '200':
          description: 'Ok. Show change password settings UI.'
  
  /settings/delete_account:
    get:
      operationId: R604
      summary: 'R604 : View Delete Account Settings'
      description: 'View the delete account settings page. Access: USR, ADM'
      tags:
        - 'M06: Privacy and Security'
      responses:
        '200':
          description: 'Ok. Show delete account settings UI.'
  
  /settings/profile_settings:
    get:
      operationId: R605
      summary: 'R605 : View Profile Settings'
      description: 'View the profile settings page. Access: USR, ADM'
      tags:
        - 'M06: Privacy and Security'
      responses:
        '200':
          description: 'Ok. Show profile settings UI.'
  
  /settings/blocked_accounts:
    get:
      operationId: R606
      summary: 'R606 : View Blocked Accounts Settings'
      description: 'View the blocked accounts settings page. Access: USR, ADM'
      tags:
        - 'M06: Privacy and Security'
      responses:
        '200':
          description: 'Ok. Show blocked accounts settings UI.'
  
  /settings/notifications:
    get:
      operationId: R408, R607
      summary: 'R408, R607 : View Notifications Settings'
      description: 'View the notifications settings page. Access: USR, ADM'
      tags:
        - 'M04: Notifications'
        - 'M06: Privacy and Security'
      responses:
        '200':
          description: 'Ok. Show notifications settings UI.'

  /admin/users:
    get:
      operationId: R701
      summary: 'R701 : View User List'
      description: 'Display a list of all users. Access: ADM'
      tags:
        - 'M07: Admin and Moderation Tools'
      responses:
        '200':
          description: 'oK. Show users list UI.'

    post:
      operationId: R702
      summary: 'R702 : Create User'
      description: 'Create a new user. Access: ADM'
      tags:
        - 'M07: Admin and Moderation Tools'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                full_name:
                  type: string
                  maxLength: 100
                admin:
                  type: boolean
              required:
                - name
                - email
                - password
                - full_name
                - admin
      responses:
        '201':
          description: 'User created successfully'
          
  /admin/users/create:
    get:
      operationId: R703
      summary: 'R703 : Create User Form'
      description: 'View the create a new user form. Access: ADM'
      tags:
        - 'M07: Admin and Moderation Tools'
      responses:
        '200':
          description: 'Ok. Show user form UI.'

  /admin/users/{id}/edit:
    get:
      operationId: R704
      summary: 'R704 : Edit User Form'
      description: 'View the edit a user form. Access: ADM'
      tags:
        - 'M07: Admin and Moderation Tools'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Ok. Show edit user UI.'

  /admin/users/{id}:
    put:
      operationId: R705
      summary: 'R705 : Edit User'
      description: 'Edit a user. Access: ADM'
      tags:
        - 'M07: Admin and Moderation Tools'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                email:
                  type: string
                  description: "A valid, unique email address."
                full_name:
                  type: string
                  maxLength: 100
                action:
                  type: string
                  enum: [promote, demote]
              required:
                - name
                - email
                - full_name
                - action
      responses:
        '302':
          description: 'Redirection after successful user edition'
          headers:
            302SuccessDemote:
