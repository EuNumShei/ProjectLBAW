  /search/members:
    get:
      operationId: R509
      summary: 'R509 : View Search Members in Group'
      description: 'View Search Members in Group. Access: PUB'
      tags:
        - 'M05: Search and Discovery'
      parameters:
        - in: query
          name: query
          schema:
            type: string
          required: true
          description: The search query string
        - in: query
          name: members
          schema:
            type: string
            enum: [group]
          required: false
          description: 'The group of members to search within (default searches all members if not specified).'
      responses:
        '200':
          description: 'Ok. Returns the matching group members in JSON format.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Unique identifier for the member
                        name:
                          type: string
                          description: Full name of the member
                        role:
                          type: string
                example:
                  members:
                    - id: "56789"
                      name: "Alice Johnson"
                    - id: "98765"
                      name: "Bob Smith"
                  total: 2

  /search/invites:
    get:
      operationId: R510
      summary: 'R510 : View Search Invites to Group'
      description: 'View Search Invites to Group. Access: PUB'
      tags:
        - 'M05: Search and Discovery'
      parameters:
        - in: query
          name: query
          schema:
            type: string
          required: true
          description: The search query string
        - in: query
          name: invites
          schema:
            type: string
            enum: [group]
          required: false
          description: 'The list of group invites to search within (default searches all invites if not specified).'
      responses:
        '200':
          description: 'Ok. Returns the matching group invites in JSON format.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  invites:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Unique identifier for the invite
                        group_name:
                          type: string
                          description: Name of the group the invite belongs to
                        invited_by:
                          type: string
                          description: The name of the person who sent the invite
                  total:
                    type: integer
                    description: Total number of matching invites
                example:
                  invites:
                    - id: "123"
                      group_name: "Photography Club"
                      invited_by: "Alice Johnson"
                    - id: "456"
                      group_name: "Book Lovers"
                      invited_by: "Bob Smith"
                  total: 2
            
